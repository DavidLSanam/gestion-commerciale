{% extends "base.html" %}{% import "_macros.html" as m %}
{% block content %}
{{ m.entete(("Modifier le" if id else "Nouveau") ~ " produit", "box-seam", None, None) }}
<div class="card shadow-sm border-0" style="max-width:640px"><div class="card-body">
<form method="post">
  <div class="mb-3"><label class="form-label" for="designation">Désignation</label>
    <input class="form-control" id="designation" name="designation" required maxlength="150" value="{{ prod.designation if prod else '' }}"></div>
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label" for="prix_vente">Prix de vente (FCFA)</label>
      <input type="number" step="0.01" min="0" class="form-control" id="prix_vente" name="prix_vente" required value="{{ prod.prix_vente if prod else '' }}"></div>
    <div class="col-md-6"><label class="form-label" for="id_categorie">Catégorie</label>
      <select class="form-select" id="id_categorie" name="id_categorie" required>
        {% for c in cats %}<option value="{{ c.id_categorie }}" {{ 'selected' if prod and prod.id_categorie|string == c.id_categorie|string }}>{{ c.libelle }}</option>{% endfor %}
      </select></div>
  </div>
  {{ m.boutons(url_for('produits')) }}
</form>
</div></div>
{% endblock %}
